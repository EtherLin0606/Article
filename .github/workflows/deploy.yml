name: Deploy Hexo Blog with Algolia

on:
  push:
    branches: [main]  # 改成你实际的主分支名，如 master / main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Set up environment variables for Algolia
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
        run: |
          echo "ALGOLIA_APP_ID=$ALGOLIA_APP_ID" >> $GITHUB_ENV
          echo "ALGOLIA_SEARCH_KEY=$ALGOLIA_SEARCH_KEY" >> $GITHUB_ENV
          echo "ALGOLIA_INDEX_NAME=$ALGOLIA_INDEX_NAME" >> $GITHUB_ENV

      - name: Generate Algolia index
        run: hexo algolia

      - name: Generate static site
        run: hexo generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public